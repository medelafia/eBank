<!-- Enhanced Sidebar Navigation -->
<div class="flex flex-col justify-between items-start py-8 border-r border-gray-200 h-screen px-6 bg-white">
  
  <!-- Top Section -->
  <div class="flex flex-col justify-between items-start w-full">
    
    <!-- Logo/Branding -->
    <div class="flex items-center gap-3 mb-12">
      <div class="bg-gradient-to-br from-fuchsia-500 to-purple-600 p-2.5 rounded-xl text-white shadow-lg">
        <lucide-icon name="landmark" [img]="Landmark" size="20"></lucide-icon>
      </div>
      <div class="flex flex-col">
        <span class="text-xl font-bold bg-gradient-to-r from-fuchsia-600 to-purple-600 bg-clip-text text-transparent">
          eBank
        </span>
        <span class="text-xs text-gray-400 font-medium">Bank In hand</span>
      </div>
    </div>

    <!-- Navigation Menu -->
    <nav class="flex flex-col w-full gap-2">
      <!-- Home -->
      <p-button 
        [routerLink]="['/']" 
        label="Home" 
        size="small" 
        icon="pi pi-home" 
        [variant]="currentRoute == '/' ? undefined : 'text'" 
        severity="secondary"
        styleClass="w-full justify-start !px-4 transition-all duration-200"
        [ngClass]="currentRoute == '/' ? '!bg-fuchsia-50 !text-fuchsia-700 !border-l-2 !border-l-fuchsia-600' : 'hover:!bg-gray-50 !text-gray-700'">
      </p-button>

      <!-- Accounts -->
      <p-button 
        [routerLink]="['/accounts']" 
        label="Accounts" 
        size="small" 
        icon="pi pi-wallet" 
        [variant]="currentRoute == '/accounts' ? undefined : 'text'" 
        severity="secondary"
        styleClass="w-full justify-start !px-4 transition-all duration-200"
        [ngClass]="currentRoute == '/accounts' ? '!bg-fuchsia-50 !text-fuchsia-700 !border-l-2 !border-l-fuchsia-600' : 'hover:!bg-gray-50 !text-gray-700'">
      </p-button>

      <!-- Users -->
      <p-button 
        [routerLink]="['/users']" 
        label="Users" 
        size="small" 
        icon="pi pi-users" 
        [variant]="currentRoute == '/users' ? undefined : 'text'" 
        severity="secondary"
        styleClass="w-full justify-start !px-4 transition-all duration-200"
        [ngClass]="currentRoute == '/users' ? '!bg-fuchsia-50 !text-fuchsia-700 !border-l-2 !border-l-fuchsia-600' : 'hover:!bg-gray-50 !text-gray-700'">
      </p-button>

      <!-- Transactions -->
      <p-button 
        [routerLink]="['/transactions']" 
        label="Transactions" 
        size="small" 
        icon="pi pi-send" 
        [variant]="currentRoute == '/transactions' ? undefined : 'text'" 
        severity="secondary"
        styleClass="w-full justify-start !px-4 transition-all duration-200"
        [ngClass]="currentRoute == '/transactions' ? '!bg-fuchsia-50 !text-fuchsia-700 !border-l-2 !border-l-fuchsia-600' : 'hover:!bg-gray-50 !text-gray-700'">
      </p-button>
    </nav>

    <!-- Optional: Additional Section Divider -->
    <div class="w-full my-8 px-4">
      <p class="text-xs uppercase font-semibold text-gray-400 tracking-wider">Settings</p>
    </div>

    <!-- Optional: Additional Menu Items -->
    <div class="flex flex-col w-full gap-2">
      <!-- Settings -->
      <p-button 
        [routerLink]="['/settings']" 
        label="Settings" 
        size="small" 
        icon="pi pi-cog" 
        variant="text"
        severity="secondary"
        styleClass="w-full justify-start !px-4 transition-all duration-200 hover:!bg-gray-50 !text-gray-700">
      </p-button>

      <!-- Reports -->
      <p-button 
        [routerLink]="['/reports']" 
        label="Reports" 
        size="small" 
        icon="pi pi-chart-bar" 
        variant="text"
        severity="secondary"
        styleClass="w-full justify-start !px-4 transition-all duration-200 hover:!bg-gray-50 !text-gray-700">
      </p-button>
    </div>

  </div>

  <!-- Bottom Section - Logout -->
  <div class="w-full flex flex-col gap-3">
    
    <!-- User Info (Optional) -->
    <div class="w-full px-4 py-3 bg-gray-50 rounded-lg border border-gray-200">
      <p class="text-xs text-gray-600">Logged in as</p>
      <!--<p class="text-sm font-semibold text-gray-900 mt-1">{{ currentUser }}</p>-->
    </div>

    <!-- Logout Button -->
    <p-button 
      [routerLink]="['/login']" 
      label="Logout" 
      icon="pi pi-sign-out" 
      size="small"
      styleClass="w-full !bg-gradient-to-br !from-fuchsia-500 !to-purple-600 !text-white !border-0 !font-semibold hover:shadow-lg transition-all duration-200">
    </p-button>

  </div>

</div>
